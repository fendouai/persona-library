[project]
name = "persona-library"
version = "0.1.0"
description = "An open writing persona template library: create, manage, mix, and apply personas to text rewriting."
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "typer>=0.9",
    "httpx>=0.24",
    "fastapi>=0.100",
    "uvicorn>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "jsonschema>=4.0", "referencing>=0.30"]

[project.scripts]
persona = "persona_lib.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
